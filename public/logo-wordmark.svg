<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMinYMid meet">
  <!-- Robot mascot -->
  <g transform="translate(20, 30)" fill="none" stroke="#1E3FD9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Motion lines -->
    <path d="M28 100 l-18 -10"/>
    <path d="M28 150 l-22 -2"/>
    <path d="M28 200 l-18 12"/>

    <!-- Body cube -->
    <path d="M52 70 L160 60 L208 100 L208 232 L116 244 L52 208 Z" fill="#FFFFFF"/>
    <path d="M52 70 L96 36 L208 46 L160 60 Z" fill="#FFFFFF"/>
    <path d="M160 60 L160 196 L208 232 L208 100 Z" fill="#FFFFFF"/>

    <!-- Top decoration -->
    <circle cx="116" cy="54" r="5" fill="#1E3FD9"/>
    <rect x="136" y="48" width="20" height="9" rx="2" fill="#FFFFFF"/>

    <!-- Front face: bar chart -->
    <line x1="74" y1="108" x2="74" y2="128"/>
    <line x1="86" y1="98"  x2="86" y2="128"/>
    <line x1="98" y1="116" x2="98" y2="128"/>
    <line x1="74" y1="128" x2="100" y2="128"/>

    <!-- Front face: trend line bottom -->
    <path d="M72 188 L90 174 L106 184 L128 162" fill="none"/>

    <!-- Right face widget -->
    <rect x="178" y="118" width="20" height="20" rx="3" fill="#FFFFFF"/>

    <!-- Face -->
    <circle cx="104" cy="148" r="6" fill="#1E3FD9"/>
    <circle cx="136" cy="146" r="6" fill="#1E3FD9"/>
    <path d="M98 166 Q120 184 142 164" fill="none" stroke-width="6"/>

    <!-- Arms (both with thumbs up) -->
    <path d="M52 166 Q20 172 12 192 Q8 204 26 208 L36 192" fill="#FFFFFF"/>
    <circle cx="20" cy="194" r="5" fill="#1E3FD9"/>

    <path d="M208 166 Q236 172 246 190 Q250 204 234 208 L224 192" fill="#FFFFFF"/>
    <circle cx="234" cy="190" r="5" fill="#1E3FD9"/>

    <!-- Legs -->
    <path d="M84 244 L84 278 L98 278" fill="#FFFFFF"/>
    <path d="M148 246 L148 280 L162 280" fill="#FFFFFF"/>
  </g>

  <!-- Check marks around the wordmark -->
  <g fill="none" stroke="#1E3FD9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 30 L322 46 L344 14"/>
    <path d="M1136 240 L1150 258 L1176 226"/>
  </g>

  <!-- Wordmark: PYDANTIC, chunky rounded display face -->
  <text x="290" y="222"
    font-family="'Space Grotesk', 'DM Sans', system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="220"
    letter-spacing="-6"
    fill="#1E3FD9">PYDANTIC</text>
</svg>
